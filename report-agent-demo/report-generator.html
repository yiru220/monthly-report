<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReportMind Agent · 智能报告生成工具</title>
<style>
  :root{
    --bg:#f5f7fb;
    --panel:#ffffff;
    --border:#e4e8f0;
    --text:#1a1f2b;
    --text-dim:#6b7488;
    --accent:#5b8cff;
    --accent-2:#7ee8c7;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.65;
  }
  .wrap{max-width:980px;margin:0 auto;padding:0 24px;}

  header{
    border-bottom:1px solid var(--border);background:#fff;position:sticky;top:0;z-index:10;
  }
  nav{display:flex;align-items:center;justify-content:space-between;height:64px;max-width:980px;margin:0 auto;padding:0 24px;}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;}
  .logo-badge{
    width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:800;
  }
  .nav-actions{display:flex;gap:10px;}

  main{padding:48px 0 80px;}

  .page-title{text-align:center;margin-bottom:36px;}
  .page-title h1{font-size:28px;font-weight:800;margin-bottom:10px;}
  .page-title p{color:var(--text-dim);font-size:15px;}

  /* UPLOAD STAGE */
  .dropzone{
    border:2px dashed var(--border);border-radius:var(--radius);background:var(--panel);
    padding:56px 24px;text-align:center;cursor:pointer;transition:border-color .2s, background .2s;
  }
  .dropzone:hover, .dropzone.dragover{border-color:var(--accent);background:#f0f4ff;}
  .dropzone .icon{font-size:42px;margin-bottom:14px;}
  .dropzone h3{font-size:17px;font-weight:700;margin-bottom:8px;}
  .dropzone p{color:var(--text-dim);font-size:13.5px;}
  .dropzone .formats{margin-top:10px;font-size:12px;color:#9aa3b8;}

  .divider-or{display:flex;align-items:center;gap:12px;margin:22px 0;color:var(--text-dim);font-size:13px;}
  .divider-or::before,.divider-or::after{content:"";flex:1;height:1px;background:var(--border);}

  .btn{
    display:inline-flex;align-items:center;gap:6px;justify-content:center;
    padding:12px 22px;border-radius:10px;font-weight:700;font-size:14px;border:none;cursor:pointer;
    transition:opacity .15s, transform .1s;
  }
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-primary{background:linear-gradient(135deg,var(--accent),#8a6bff);color:#fff;box-shadow:0 10px 24px -10px #5b8cff99;}
  .btn-secondary{background:#eef1f8;color:var(--text);}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn-block{width:100%;}

  .status-msg{text-align:center;margin-top:16px;font-size:13.5px;color:var(--text-dim);min-height:20px;}
  .status-msg.error{color:#e0455a;font-weight:600;}

  .filename-tag{
    display:none;margin-top:18px;padding:10px 16px;border-radius:10px;background:#eafaf1;color:#1b7a4f;
    font-size:13.5px;font-weight:600;text-align:center;
  }
  .filename-tag.show{display:block;}

  .data-check{margin-top:28px;}
  .data-check h4{font-size:14px;font-weight:700;margin-bottom:10px;color:var(--text-dim);}
  .col-tag{
    display:inline-block;padding:6px 10px;margin:0 6px 8px 0;border-radius:8px;font-size:12.5px;font-weight:600;
  }
  .col-tag i{font-style:normal;opacity:.65;margin-left:4px;font-weight:500;}
  .tag-num{background:#eef2ff;color:#4457c2;}
  .tag-date{background:#fff3e6;color:#b5690b;}
  .tag-str{background:#eafaf1;color:#1b7a4f;}

  .preview-table-wrap{margin-top:14px;overflow-x:auto;border:1px solid var(--border);border-radius:10px;}
  table.data-preview{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap;}
  table.data-preview th,table.data-preview td{padding:8px 12px;border-bottom:1px solid var(--border);text-align:left;}
  table.data-preview th{background:#f8f9fc;color:var(--text-dim);font-weight:700;}
  .preview-more{padding:8px 12px;font-size:12px;color:#9aa3b8;background:#fafbfd;}

  .generate-bar{margin-top:28px;display:flex;gap:12px;justify-content:center;}

  /* REPORT STAGE */
  #reportStage{display:none;}
  .report-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .report-toolbar .left{display:flex;gap:10px;}

  #reportRoot{
    background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:40px;
  }
  .report-header{border-bottom:2px solid var(--text);padding-bottom:16px;margin-bottom:28px;}
  .report-title{font-size:24px;font-weight:800;}
  .report-meta{font-size:13px;color:var(--text-dim);margin-top:6px;}
  .narrative-tag{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;}
  .narrative-tag.ai{background:#eef2ff;color:#4457c2;}
  .narrative-tag.rule{background:#eef1f8;color:#6b7488;}

  .report-section{margin-bottom:30px;}
  .report-section h3{
    font-size:16px;font-weight:800;margin-bottom:10px;color:var(--accent);
    border-left:4px solid var(--accent);padding-left:10px;
  }
  .report-section p{font-size:14px;color:#333a4a;}
  .report-section ul{margin:10px 0 0 20px;font-size:14px;color:#333a4a;}
  .report-section li{margin-bottom:6px;}

  .chart-box{margin-top:16px;background:#fafbfd;border:1px solid var(--border);border-radius:10px;padding:16px;max-width:640px;}

  table.summary-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px;}
  table.summary-table th,table.summary-table td{padding:9px 12px;border-bottom:1px solid var(--border);text-align:left;}
  table.summary-table th{background:#f8f9fc;color:var(--text-dim);font-weight:700;}

  footer{text-align:center;padding:30px 0;color:#9aa3b8;font-size:12.5px;}

  @media (max-width:640px){
    #reportRoot{padding:20px;}
    .report-title{font-size:20px;}
  }
</style>
</head>
<body>

<header>
  <nav>
    <div class="logo"><div class="logo-badge">R</div>ReportMind Agent</div>
    <div class="nav-actions">
      <button class="btn btn-ghost" id="btnReset" style="display:none;">重新上传</button>
    </div>
  </nav>
</header>

<main>
  <div class="wrap">

    <div id="uploadStage">
      <div class="page-title">
        <h1>上传数据，自动生成分析报告</h1>
        <p>支持 Excel（.xlsx / .xls）与 CSV 文件，系统会在本地浏览器中真实解析数据、完成统计分析并生成图表与文案。</p>
      </div>

      <div class="dropzone" id="dropzone">
        <div class="icon">📁</div>
        <h3>点击或拖拽文件到此处上传</h3>
        <p>我们会自动识别数值列、分类列与日期列</p>
        <div class="formats">支持格式：.xlsx .xls .csv ｜ 数据仅在本地浏览器中处理，不会上传到服务器</div>
      </div>
      <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display:none;">

      <div class="divider-or">没有数据文件？</div>
      <button class="btn btn-secondary btn-block" id="btnDemo">使用示例数据体验（零售季度销售数据）</button>

      <div class="filename-tag" id="fileNameTag"></div>

      <div class="status-msg" id="statusMsg"></div>

      <div id="dataCheckArea">
        <div class="data-check" id="columnMapArea" style="display:none;">
          <h4>系统识别的字段类型</h4>
          <div id="columnMapWrap"></div>
        </div>
        <div class="data-check" id="previewArea" style="display:none;">
          <h4>数据预览</h4>
          <div class="preview-table-wrap" id="previewTableWrap"></div>
        </div>
      </div>

      <div class="generate-bar">
        <button class="btn btn-primary" id="btnGenerate" disabled>生成分析报告 →</button>
      </div>
    </div>

    <div id="reportStage">
      <div class="report-toolbar">
        <div class="left">
          <button class="btn btn-ghost" id="btnBackTop" onclick="document.getElementById('uploadStage').style.display='';document.getElementById('reportStage').style.display='none';">← 返回</button>
        </div>
        <button class="btn btn-primary" id="btnExportPdf">导出 PDF</button>
      </div>
      <div id="reportRoot"></div>
    </div>

  </div>
</main>

<footer>ReportMind Agent · 数据分析与报告自动生成工具 · 所有计算在本地浏览器完成</footer>

<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/chart.umd.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/html2canvas.min.js"></script>
<script src="app.js"></script>
<script>
  // 数据预览区域的显示/隐藏联动（挂在原有逻辑之外，不侵入 app.js 的状态管理）
  const _origIngest = document.getElementById('columnMapWrap');
  const mo = new MutationObserver(() => {
    document.getElementById('columnMapArea').style.display = document.getElementById('columnMapWrap').innerHTML ? '' : 'none';
    document.getElementById('previewArea').style.display = document.getElementById('previewTableWrap').innerHTML ? '' : 'none';
    document.getElementById('btnReset').style.display = document.getElementById('fileNameTag').classList.contains('show') ? '' : 'none';
  });
  mo.observe(document.getElementById('columnMapWrap'), { childList: true });
  mo.observe(document.getElementById('previewTableWrap'), { childList: true });
  mo.observe(document.getElementById('fileNameTag'), { attributes: true });
</script>
</body>
</html>
